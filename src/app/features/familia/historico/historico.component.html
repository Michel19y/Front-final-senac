<a class="voltar" routerLink="/familia">&larr; Voltar para a família</a>

<h2>Histórico de reprodução</h2>

@if (erro(); as msg) {
  <p class="erro">{{ msg }}</p>
}

<div class="cartao">
  <table>
    <thead>
      <tr>
        <th>Data/Hora</th>
        <th>Música</th>
      </tr>
    </thead>
    <tbody>
      @for (item of historico(); track item.dataHora + item.titulo) {
        <tr>
          <td>{{ item.dataHora | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ item.titulo }}</td>
        </tr>
      } @empty {
        <tr><td colspan="2">Nenhuma reprodução registrada.</td></tr>
      }
    </tbody>
  </table>
</div>
