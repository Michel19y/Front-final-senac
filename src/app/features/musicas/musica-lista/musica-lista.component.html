<h2>Músicas</h2>

<div class="busca">
  <input type="text" placeholder="Buscar por título..." [(ngModel)]="termo" (keyup.enter)="buscar()" />
  <button type="button" (click)="buscar()">Buscar</button>
</div>

@if (mensagem(); as msg) {
  <p class="sucesso">{{ msg }}</p>
}

@if (erro(); as msg) {
  <p class="erro">{{ msg }}</p>
}

<div class="cartao">
  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Título</th>
        <th>Explícito</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (musica of musicas(); track musica.id) {
        <tr>
          <td>{{ musica.id }}</td>
          <td>{{ musica.titulo }}</td>
          <td>{{ musica.explicito ? 'Sim' : 'Não' }}</td>
          <td><button type="button" (click)="reproduzir(musica)">Reproduzir</button></td>
        </tr>
      } @empty {
        <tr><td colspan="4">Nenhuma música encontrada.</td></tr>
      }
    </tbody>
  </table>
</div>
