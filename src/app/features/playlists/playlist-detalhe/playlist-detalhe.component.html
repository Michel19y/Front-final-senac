<a class="voltar" routerLink="/playlists">&larr; Voltar para playlists</a>

<h2>Músicas da playlist</h2>

<div class="adicionar">
  <input type="number" placeholder="ID da música" [(ngModel)]="novaMusicaId" />
  <button type="button" (click)="adicionar()">Adicionar música</button>
</div>

@if (erro(); as msg) {
  <p class="erro">{{ msg }}</p>
}

<div class="cartao">
  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Título</th>
        <th>Explícito</th>
      </tr>
    </thead>
    <tbody>
      @for (musica of musicas(); track musica.id) {
        <tr>
          <td>{{ musica.id }}</td>
          <td>{{ musica.titulo }}</td>
          <td>{{ musica.explicito ? 'Sim' : 'Não' }}</td>
        </tr>
      } @empty {
        <tr><td colspan="3">Esta playlist ainda não tem músicas.</td></tr>
      }
    </tbody>
  </table>
</div>
